
name: Deploy Zunera Website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Rebuild every day at 06:30 IST (01:00 UTC) so new Instagram posts appear on the home page
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy run as separate jobs (GitHub's recommended layout). In one job, the deploy step
# sometimes looked for the uploaded site before GitHub had registered it, and the run failed.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep the last Instagram posts that downloaded, so a failed fetch never falls back to old photos
      - name: Restore last Instagram feed
        uses: actions/cache@v4
        with:
          path: site/assets/social/live
          key: instagram-feed-${{ github.run_id }}
          restore-keys: instagram-feed-

      - name: Build Zunera website
        run: node build.js
        env:
          INSTAGRAM_FEED_URL: ${{ secrets.INSTAGRAM_FEED_URL }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}

      - name: Preserve custom domain
        run: cp CNAME site/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
